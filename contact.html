<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Ayan-Yue Gupta</title>
	<link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css?family=Roboto:100,200,300,400" rel="stylesheet"> 
    </head>
    <body>
	<script src="template.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
	<script>
	    loadTemplate("Ayan-Yue Gupta", `

	<!-- CONTACT FORM -->
        <div class="container">
            
            <form class="contact-form" id="contact-form">
                <div class="form-group">
                    <label for="name">Name <span class="required">*</span></label>
                    <input type="text" id="name" name="from_name" required>
                </div>
    
                <div class="form-group">
                    <label for="email">Email <span class="required">*</span></label>
                    <input type="email" id="email" name="from_email" required>
                </div>
    
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject">
                </div>
    
                <div class="form-group">
                    <label for="message">Message <span class="required">*</span></label>
                    <textarea id="message" name="message" placeholder="Enter your message here..." required></textarea>
                </div>
    
                <button type="submit" class="submit-btn">Send Message</button>
                
                <p class="form-note">
                    <span class="required">*</span> Required fields
                </p>
            </form>
        </div>
    
	`);
        </script>

	<script>
	    emailjs.init('m2zZKWVRJLd6b7YJs')
            setTimeout(() => {
	        document.querySelector('.contact-form').addEventListener('submit', async (e) => {
	        e.preventDefault();
                    
                // Get form data
                const formData = new FormData(e.target);
                const params = {
	            name: formData.get('from_name'),
	            email: formData.get('from_email'),
	            subject: formData.get('subject'),
	            time: new Date().toLocaleString(),
		    message: formData.get('message'),
	        };
	        
	        try {
	            await emailjs.send('service_lda1k8m', 'template_fb0ri4d', params);
	            alert('Message sent.');
	            e.target.reset();
	        } catch (error) {
	            alert('Failed to send message.');
	        }
            });
        }, 100);
                
        </script>

    </body>
</html>
